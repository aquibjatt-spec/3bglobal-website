<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070d33" />

    <title>Three Brothers Linguistics | Global Translation, Localization & AI Data Services</title>
    <meta
      name="description"
      content="Three Brothers Linguistics delivers premium translation, transcription, localization, voice recording, AI data collection, data annotation and interpretation services across 50+ languages for global enterprises and AI companies."
    />
    <meta name="keywords" content="translation services, localization, transcription, AI data collection, data annotation, voice recording, interpretation, linguistic QA, multilingual, global language solutions, Three Brothers Linguistics, 3bglobal" />
    <meta name="author" content="Three Brothers Linguistics" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://3bglobal.online/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Three Brothers Linguistics" />
    <meta property="og:title" content="Three Brothers Linguistics | Global Language Solutions" />
    <meta property="og:description" content="Premium translation, localization, AI data collection, voice recording and interpretation services across 50+ languages for global enterprises and AI companies." />
    <meta property="og:url" content="https://3bglobal.online/" />
    <meta property="og:image" content="https://images.pexels.com/photos/5684444/pexels-photo-5684444.jpeg?auto=compress&cs=tinysrgb&w=1200" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Three Brothers Linguistics | Global Language Solutions" />
    <meta name="twitter:description" content="Premium translation, localization, AI data collection, voice recording and interpretation services across 50+ languages." />
    <meta name="twitter:image" content="https://images.pexels.com/photos/5684444/pexels-photo-5684444.jpeg?auto=compress&cs=tinysrgb&w=1200" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Three Brothers Linguistics",
        "alternateName": "3B Global",
        "url": "https://3bglobal.online/",
        "logo": "https://3bglobal.online/favicon.svg",
        "email": "info@3bglobal.online",
        "description": "Global language solutions company providing professional translation, transcription, localization, voice recording, AI data collection, data annotation and interpretation services across 50+ languages.",
        "areaServed": "Worldwide",
        "knowsAbout": [
          "Translation",
          "Localization",
          "Transcription",
          "Subtitling",
          "Interpretation",
          "Voice Recording",
          "AI Data Collection",
          "Data Annotation",
          "Linguistic Quality Assurance"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "info@3bglobal.online",
          "availableLanguage": ["English", "Urdu", "Arabic", "Hindi", "Spanish", "French", "German", "Chinese", "Japanese"]
        }
      }
    </script>

    <!-- Structured Data: Service Catalog -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OfferCatalog",
        "name": "Language Solutions",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Translation Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Transcription Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Localization Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Subtitling & Captioning" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Interpretation Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Voice Recording Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Data Collection" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Data Annotation Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Linguistic Quality Assurance" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
